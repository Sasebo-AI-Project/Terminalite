[project]
name = "terminalite"
version = "0.1.0"
description = "A 6M-parameter GRU that turns English or Japanese requests into bash commands on CPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sasebo AI Project" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tokenizers>=0.15"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
]

[project.scripts]
tl = "terminalite.cli:main"
terminalite = "terminalite.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
